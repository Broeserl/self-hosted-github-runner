services:
  github-runner:
    build: .
    # Container-Name aus der Env: CONTAINER_NAME > RUNNER_NAME > github-runner.
    # Mehrere Runner auf einer VM = mehrere Repo-Klone mit eigener .env.
    container_name: ${CONTAINER_NAME:-${RUNNER_NAME:-github-runner}}
    restart: unless-stopped
    environment:
      RUNNER_NAME: ${RUNNER_NAME}
      RUNNER_URL: ${RUNNER_URL}
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      # Kommagetrennte Labels, z.B. self-hosted,linux,x64,rust
      RUNNER_LABELS: ${RUNNER_LABELS:-self-hosted,linux,x64}
      # 1 = frischer Runner-Zustand pro Job (empfohlen fuer public repos)
      RUNNER_EPHEMERAL: ${RUNNER_EPHEMERAL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # State-Volume: Registrierung (.runner) + Job-Workspaces ueberleben
      # Container-Neuerstellungen. Beim ersten Mount kopiert Docker die
      # Image-Dateien (config.sh/run.sh/bin) automatisch hinein.
      # Achtung: das offizielle Image legt sie direkt in /home/runner ab.
      - runner-state:/home/runner

volumes:
  runner-state:
